spring.application.name=dronewaste-back
server.port=8080

# ── H2 in-memory ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dronewastedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# none: usamos schema.sql manual; always: corre data.sql en cada arranque
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# ── SQL init ─────────────────────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.dronewaste=DEBUG
logging.level.org.springframework.web.socket=INFO
